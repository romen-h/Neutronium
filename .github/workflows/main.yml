name: Build & Update Docs

on:
  push:
    branches:
      - main # Change to master or your default branch if different
  workflow_dispatch: # Allows you to trigger the build manually

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout ONI-Libs
        uses: actions/checkout@v5
        with:
          repository: 'romen-h/ONI-Libs'
          path: 'gamelibs'
          token: ${{ secrets.ONI_LIBS_PAT }}

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0' # Specify your project's .NET version

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build Soltuion
        run: dotnet build -c GithubRelease

      - name: Build DocFX Site
        # Replace 'docfx.json' with the relative path to your file if it's in a subdirectory (e.g., 'docs/docfx.json')
        run: docfx docfx/docfx.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site # Change this if your docfx.json uses a custom "dest" output folder
